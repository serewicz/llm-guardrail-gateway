# Policy as code. Changes go through pull-request review like any other code.
# All departments, users and prices here are FICTIONAL demo values.
version: "0.1-demo"
default_dept: unassigned

models:
  onprem-llama:  { provider: mock, hosted: false, usd_per_1k_in: 0.0002, usd_per_1k_out: 0.0002 }
  hosted-small:  { provider: mock, hosted: true,  usd_per_1k_in: 0.0005, usd_per_1k_out: 0.0015 }
  hosted-large:  { provider: mock, hosted: true,  usd_per_1k_in: 0.005,  usd_per_1k_out: 0.015 }
  utility-rag:   { provider: utility-rag, hosted: false, base_url: "http://localhost:8000", usd_per_1k_in: 0.0002, usd_per_1k_out: 0.0002 }

# monthly_budget_usd: omit for no budget. at_limit: block | route_cheaper (needs fallback_model).
departments:
  water-operations: { monthly_budget_usd: 200, models: [onprem-llama, hosted-small, utility-rag] }
  legal:            { monthly_budget_usd: 100, models: [onprem-llama] }      # no hosted models
  it:               { monthly_budget_usd: 500, models: [hosted-large, hosted-small, onprem-llama],
                      at_limit: route_cheaper, fallback_model: hosted-small }
  unassigned:       { monthly_budget_usd: 5,   models: [onprem-llama] }

labels:
  cip-restricted:   { allow_hosted_model: false }
  pii:              { allow_hosted_model: false }
  public:           { allow_hosted_model: true }

budgets:
  warn_at_pct: 80
  at_limit: block         # default; departments can override

# DEMO identity map. In production this comes from SSO group claims.
users:
  maria: water-operations
  lee: legal
  dev: it

audit:
  log_prompt_text: hash   # full | hash | omit
